<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}EstimateX{% endblock %}</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="bg-orbs" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="page">
    <header class="site-header anim-in anim-delay-0">
      <div class="wordmark">
        <svg class="wordmark-icon" width="60" height="60" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="EstimateX">
          <rect width="100" height="100" rx="24" fill="#2a1c22"/>
          <circle cx="50" cy="52" r="36" fill="#f4f2ec"/>
          <g stroke="#2a1c22" stroke-width="3" stroke-linecap="round">
            <line x1="50" y1="18" x2="50" y2="24"/>
            <line x1="50" y1="80" x2="50" y2="86"/>
            <line x1="16" y1="52" x2="22" y2="52"/>
            <line x1="78" y1="52" x2="84" y2="52"/>
          </g>
          <text x="50" y="66" font-family="Georgia, serif" font-weight="700" font-size="46" fill="#c9c6c0" fill-opacity="0.55" text-anchor="middle">&#8377;</text>
          <g stroke="#1a1114" stroke-width="5" stroke-linecap="round">
            <line x1="50" y1="52" x2="50" y2="30"/>
            <line x1="50" y1="52" x2="66" y2="40"/>
          </g>
          <circle cx="50" cy="52" r="4" fill="#1a1114"/>
        </svg>
        <span class="wordmark-text">Estimate<span class="accent-letter">X</span></span>
      </div>
      <p class="wordmark-tagline">Time &times; Cost — Estimated</p>
    </header>
    <main class="content">
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
