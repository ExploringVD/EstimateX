<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}EstimateX{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="page">
    <header class="site-header">
      <div class="wordmark">
        <svg class="wordmark-icon" width="28" height="24" viewBox="0 0 28 24" aria-hidden="true">
          <rect x="0" y="14" width="6" height="10" rx="1.5" fill="#2C5FCB" fill-opacity="1"/>
          <rect x="11" y="8" width="6" height="16" rx="1.5" fill="#2C5FCB" fill-opacity="0.65"/>
          <rect x="22" y="0" width="6" height="24" rx="1.5" fill="#2C5FCB" fill-opacity="0.35"/>
        </svg>
        <span class="wordmark-text">Estimate<span class="accent-letter">X</span></span>
      </div>
    </header>
    <main class="content">
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
